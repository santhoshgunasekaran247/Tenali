<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vendor Contributions | SRU Global</title><link rel="stylesheet" href="css/style.css"><style>body{background:#f8f5f0}.wrap{max-width:1300px;margin:auto;padding:28px}.panel{background:#fff;border:1px solid #e5e0d9;border-radius:14px;padding:20px;margin:16px 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.wide{grid-column:1/-1}label{display:flex;flex-direction:column;gap:5px}input,select,textarea{padding:10px;border:1px solid #ccc;border-radius:8px}button,.btn{padding:10px 14px;border:0;border-radius:9px;background:#7A1F3D;color:#fff;cursor:pointer;text-decoration:none}.secondary{background:#1f2937}.muted{color:#6b7280}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid #eee;text-align:left;white-space:nowrap}@media(max-width:700px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}}</style></head><body><main class="wrap"><div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap"><a href="portal.html?demo=admin">← Operations Portal</a><a href="prototype-admin.html">CSV Configuration</a></div><h1>Vendor Contribution Manager</h1><p class="muted">CSV prototype for mapping vendor-supplied product information to the SRU catalogue.</p><section class="panel"><h2>Add Contribution</h2><div class="grid"><label>Vendor<select id="vendor"></select></label><label>Map to Product<select id="product"></select></label><label>SKU<input id="sku"></label><label>Size<input id="size"></label><label>Colour<input id="colour"></label><label>GTIN<input id="gtin"></label><label>Unit Count<input id="unit_count" type="number"></label><label>Weight<input id="weight"></label><label>Height<input id="height"></label><label>Width<input id="width"></label><label>Length<input id="length"></label><label>Item Name<input id="item_name"></label><label class="wide">Description<textarea id="description"></textarea></label><label>MRP<input id="mrp" type="number"></label><label>Buying Price<input id="buying_price" type="number"></label><label>Selling Price<input id="selling_price" type="number"></label><label>Vendor Product URL<input id="vendor_product_url"></label><label>Vendor Reference<input id="vendor_reference"></label></div><p><button id="create">Prototype: Create Contribution</button> <button class="secondary" id="newproduct">Create New Catalogue Product</button></p><p id="msg"></p></section><section class="panel"><h2>Existing Contributions</h2><div class="table-wrap"><table><thead><tr><th>ID</th><th>Vendor</th><th>Product</th><th>SKU</th><th>Size</th><th>Colour</th><th>Buying</th><th>Selling</th></tr></thead><tbody id="rows"></tbody></table></div></section></main><script>
async function csv(n){const t=await fetch('data/'+n).then(r=>r.text());return parse(t)}function parse(t){const a=t.trim().split(/\r?\n/).map(x=>x.split(/,(?=(?:[^\"]*\"[^\"]*\")*[^\"]*$)/));const h=a.shift();return a.map(r=>Object.fromEntries(h.map((k,i)=>[k,(r[i]||'').replace(/^"|"$/g,'').replace(/""/g,'"')])))}const money=n=>'₹'+Number(n||0).toLocaleString('en-IN');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let vendors,products,contrib;
async function init(){[vendors,products,contrib]=await Promise.all([csv('vendors.csv'),csv('products.csv'),csv('vendor_contributions.csv')]);vendors=vendors.filter(x=>x.vendor_id);products=products.filter(x=>x.portal_product_id);document.getElementById('vendor').innerHTML=vendors.map(v=>`<option value="${v.vendor_id}">${esc(v.name||v.nickname)}</option>`).join('');document.getElementById('product').innerHTML='<option value="">Not mapped / create product</option>'+products.map(p=>`<option value="${p.portal_product_id}">${esc(p.portal_product_id)} — ${esc(p.name)}</option>`).join('');draw();const q=new URLSearchParams(location.search).get('product');if(q)document.getElementById('product').value=q}
function draw(){const vm=Object.fromEntries(vendors.map(v=>[v.vendor_id,v.name||v.nickname]));const pm=Object.fromEntries(products.map(p=>[p.portal_product_id,p.name]));document.getElementById('rows').innerHTML=contrib.map(c=>`<tr><td>${esc(c.contribution_id)}</td><td>${esc(vm[c.vendor_id]||c.vendor_id)}</td><td>${esc(pm[c.product_id]||'Not mapped')}</td><td>${esc(c.sku)}</td><td>${esc(c.size)}</td><td>${esc(c.colour)}</td><td>${money(c.buying_price)}</td><td>${money(c.selling_price)}</td></tr>`).join('')}
document.getElementById('create').onclick=()=>{const id='CON-'+String(contrib.length+1).padStart(6,'0');const c={contribution_id:id,vendor_id:vendor.value,product_id:product.value,variant_id:'',sku:sku.value,size:size.value,colour:colour.value,gtin:gtin.value,unit_count:unit_count.value,weight:weight.value,height:height.value,width:width.value,length:length.value,item_name:item_name.value,description:description.value,mrp:mrp.value,buying_price:buying_price.value,selling_price:selling_price.value,vendor_product_url:vendor_product_url.value,vendor_reference:vendor_reference.value,active:'true'};contrib.push(c);draw();msg.textContent='Contribution added to the in-memory prototype. Export/save is intentionally left for the database implementation.'};document.getElementById('newproduct').onclick=()=>{const name=item_name.value||'New Catalogue Product';msg.textContent=`Prototype flow: create a new permanent Product ID for “${name}”, then link this contribution to it.`};init();
</script></body></html>
