<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SRU Global | Create account</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/portal.css"></head><body class="auth-body"><div class="auth-shell"><a href="index.html" class="auth-logo"><img src="assets/sru-global-logo.png" alt="SRU Global"></a><section class="auth-card"><p class="eyebrow">NEW SRU ACCOUNT</p><h1>Verify your identity.<br><span>Choose your username.</span></h1><p class="auth-copy">Register with email or phone. A username is generated from the verified identity unless you choose an available custom username.</p><form id="register-form"><label>Full name<input id="reg-name" required></label><label>Email<input id="reg-email" type="email"></label><label>Phone number<input id="reg-phone" type="tel" placeholder="+91..."></label><label>Custom username (optional)<input id="reg-username" placeholder="Leave blank to generate"></label><label>Password<input id="reg-password" type="password" minlength="8" required></label><div class="verify-row"><button type="button" class="btn secondary-btn" id="verify-email">Verify email</button><button type="button" class="btn secondary-btn" id="verify-phone">Verify phone</button></div><button class="btn auth-submit" type="submit">Create account</button><p id="register-result" class="form-message"></p></form><p class="auth-foot"><a href="login.html">← Back to sign in</a></p></section></div><script src="data/portal.js"></script><script src="js/register.js"></script></body></html>
