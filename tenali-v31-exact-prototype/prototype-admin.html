<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SRU Global | CSV Prototype Admin</title><link rel="stylesheet" href="css/style.css"><style>
body{background:#f8f5f0}.proto{max-width:1400px;margin:0 auto;padding:28px}.proto h1{margin-bottom:6px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}.tabs button{border:1px solid #ddd;background:#fff;padding:10px 14px;border-radius:10px;cursor:pointer}.tabs button.active{background:var(--primary,#7A1F3D);color:#fff}.panel{background:#fff;border:1px solid #e5e0d9;border-radius:14px;padding:20px;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.stat{padding:16px;background:#faf8f5;border-radius:12px}.stat b{display:block;font-size:24px;margin-top:5px}.table-wrap{overflow:auto}.table-wrap table{width:100%;border-collapse:collapse}.table-wrap th,.table-wrap td{padding:10px;border-bottom:1px solid #eee;text-align:left;white-space:nowrap}.search{padding:10px;border:1px solid #ccc;border-radius:9px;width:min(420px,100%)}.tag{display:inline-block;padding:4px 8px;border-radius:99px;background:#eee;font-size:12px}.tag.gold{background:#f3e7b1}.tag.green{background:#dcefdc}.theme-row{display:flex;align-items:center;gap:12px;margin:10px 0}.theme-row input[type=color]{width:54px;height:34px;border:0;background:none}.muted{color:#6b7280}.btn{display:inline-block;padding:10px 14px;border-radius:9px;border:0;background:#7A1F3D;color:#fff;text-decoration:none;cursor:pointer}.btn.secondary{background:#1F2937}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.form-grid label{display:flex;flex-direction:column;gap:5px}.form-grid input,.form-grid select,.form-grid textarea{padding:9px;border:1px solid #ccc;border-radius:8px}.wide{grid-column:1/-1}@media(max-width:700px){.form-grid{grid-template-columns:1fr}}
</style></head><body><main class="proto"><a href="portal.html">← Operations Portal</a><h1>CSV / HTML Prototype Administration</h1><p class="muted">Prototype data is read from the CSV files in <code>data/</code>. This is intentionally the pre-database version.</p><div class="tabs"><button data-tab="products">Products</button><button data-tab="contributions">Vendor Contributions</button><button data-tab="theme">Theme</button><button data-tab="config">Page & System Config</button></div><section id="view"></section></main><script>
const state={};
async function csv(name){const r=await fetch('data/'+name);const t=await r.text();return parse(t)}
function parse(t){const lines=t.replace(/^\uFEFF/,'').trim().split(/\r?\n/);if(!lines.length)return[];const out=[];let row=[],cell='',q=false;for(let i=0;i<t.length;i++){const c=t[i],n=t[i+1];if(c==='"'){if(q&&n==='"'){cell+='"';i++}else q=!q}else if(c===','&&!q){row.push(cell);cell=''}else if((c==='\n'||c==='\r')&&!q){if(c==='\r'&&n==='\n')i++;row.push(cell);if(row.some(x=>x!=='')){out.push(row)}row=[];cell=''}else cell+=c}if(row.length){row.push(cell);out.push(row)}const h=out.shift();return out.map(r=>Object.fromEntries(h.map((k,i)=>[k,r[i]??''])))}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'₹'+Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:0});
async function init(){state.products=await csv('products.csv');state.contributions=await csv('vendor_contributions.csv');state.vendors=await csv('vendors.csv');state.variants=await csv('product_variants.csv');state.theme=await csv('theme.csv');state.pages=await csv('pages.csv');state.widgets=await csv('dashboard_widgets.csv');state.config=await csv('configuration.csv');state.brands=await csv('brands.csv');state.categories=await csv('categories.csv');render('products')}
function render(tab){document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));const v=document.getElementById('view');if(tab==='products')return renderProducts(v);if(tab==='contributions')return renderContributions(v);if(tab==='theme')return renderTheme(v);return renderConfig(v)}
function renderProducts(v){const p=state.products.filter(x=>x.row_type==='product');v.innerHTML=`<div class="panel"><div class="grid"><div class="stat">Products<b>${p.length}</b></div><div class="stat">Vendors<b>${state.vendors.filter(x=>x.vendor_id).length}</b></div><div class="stat">Contributions<b>${state.contributions.length}</b></div><div class="stat">Variants<b>${state.variants.length}</b></div></div></div><div class="panel"><h2>Catalogue Product Master</h2><input class="search" id="ps" placeholder="Search product, brand, ID..."><div class="table-wrap"><table><thead><tr><th>Product ID</th><th>Product</th><th>Brand</th><th>Category</th><th>MRP</th><th>Our Price</th><th>Vendor Contributions</th></tr></thead><tbody id="pt"></tbody></table></div></div>`;const draw=()=>{const q=document.getElementById('ps').value.toLowerCase();document.getElementById('pt').innerHTML=p.filter(x=>[x.portal_product_id,x.name,x.brand,x.category].join(' ').toLowerCase().includes(q)).map(x=>{const cs=state.contributions.filter(c=>c.product_id===x.portal_product_id);return `<tr><td>${esc(x.portal_product_id)}</td><td><b>${esc(x.name)}</b></td><td>${esc(x.brand)}</td><td>${esc(x.category)}</td><td>${money(x.mrp)}</td><td>${money(x.our_price)}</td><td><span class="tag">${cs.length} contribution(s)</span> <a href="vendor-contributions.html?product=${encodeURIComponent(x.portal_product_id)}">View / Add</a></td></tr>`}).join('')};document.getElementById('ps').oninput=draw;draw()}
function renderContributions(v){const vendorMap=Object.fromEntries(state.vendors.filter(x=>x.vendor_id).map(x=>[x.vendor_id,x.name||x.nickname]));const productMap=Object.fromEntries(state.products.filter(x=>x.portal_product_id).map(x=>[x.portal_product_id,x.name]));v.innerHTML=`<div class="panel"><h2>Vendor Contributions</h2><p>Each vendor can contribute a product specification and commercial offer. A contribution can map to an existing catalogue product or be used to create one.</p><a class="btn" href="vendor-contributions.html">Open Contribution Manager</a></div><div class="panel"><div class="table-wrap"><table><thead><tr><th>Contribution</th><th>Vendor</th><th>Product</th><th>SKU</th><th>Size</th><th>Colour</th><th>GTIN</th><th>Buying</th><th>Selling</th></tr></thead><tbody>${state.contributions.map(c=>`<tr><td>${esc(c.contribution_id)}</td><td>${esc(vendorMap[c.vendor_id]||c.vendor_id)}</td><td>${esc(productMap[c.product_id]||'Not mapped')}</td><td>${esc(c.sku)}</td><td>${esc(c.size)}</td><td>${esc(c.colour)}</td><td>${esc(c.gtin)}</td><td>${money(c.buying_price)}</td><td>${money(c.selling_price)}</td></tr>`).join('')}</tbody></table></div></div>`}
function renderTheme(v){v.innerHTML=`<div class="panel"><h2>Theme Configuration</h2><p>These values come from <code>data/theme.csv</code>. In the database version the same records will live in the theme configuration table.</p>${state.theme.filter(x=>x.value_type==='color').map(x=>`<div class="theme-row"><input type="color" value="${esc(x.value)}" data-theme="${esc(x.theme_key)}"><b>${esc(x.theme_key)}</b><code>${esc(x.value)}</code></div>`).join('')}<button class="btn" id="themePreview">Preview</button></div><div class="panel" id="preview"><h2>SRU Global</h2><p>Configurable premium business theme.</p><button class="btn">Example Button</button></div>`;document.querySelectorAll('[data-theme]').forEach(i=>i.oninput=()=>{const t=state.theme.find(x=>x.theme_key===i.dataset.theme);if(t)t.value=i.value;applyTheme()});document.getElementById('themePreview').onclick=applyTheme;applyTheme()}
function applyTheme(){const root=document.documentElement;state.theme.filter(x=>x.value_type==='color').forEach(x=>root.style.setProperty('--'+x.theme_key,x.value));const p=document.getElementById('preview');if(p){p.style.background='var(--surface)';p.style.color='var(--text)';document.querySelectorAll('.btn').forEach(b=>b.style.background='var(--primary)')}}
function renderConfig(v){v.innerHTML=`<div class="panel"><h2>Pages</h2><div class="table-wrap"><table><thead><tr><th>Key</th><th>Title</th><th>Subtitle</th><th>Active</th><th>Order</th></tr></thead><tbody>${state.pages.map(x=>`<tr><td>${esc(x.page_key)}</td><td>${esc(x.title)}</td><td>${esc(x.subtitle)}</td><td>${esc(x.active)}</td><td>${esc(x.display_order)}</td></tr>`).join('')}</tbody></table></div></div><div class="panel"><h2>Dashboard Widgets</h2><div class="table-wrap"><table><thead><tr><th>Widget</th><th>Title</th><th>Active</th><th>Order</th><th>Permission</th></tr></thead><tbody>${state.widgets.map(x=>`<tr><td>${esc(x.widget_key)}</td><td>${esc(x.title)}</td><td>${esc(x.active)}</td><td>${esc(x.display_order)}</td><td>${esc(x.permission)}</td></tr>`).join('')}</tbody></table></div></div><div class="panel"><h2>System Configuration</h2><div class="table-wrap"><table><thead><tr><th>Key</th><th>Value</th><th>Type</th><th>Description</th></tr></thead><tbody>${state.config.map(x=>`<tr><td>${esc(x.config_key)}</td><td>${esc(x.value)}</td><td>${esc(x.value_type)}</td><td>${esc(x.description)}</td></tr>`).join('')}</tbody></table></div></div>`}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>render(b.dataset.tab));init().catch(e=>document.getElementById('view').innerHTML='<div class="panel"><b>Run this prototype through a local web server.</b><p>Example: <code>python -m http.server 8000</code></p></div>');
</script></body></html>
